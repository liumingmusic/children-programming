\",\"description\":\"把好几个不同频率的波浪叠在一起——得到的起伏意外地像真的山脉，这就是噪声的本质。\",\"category\":\"creative\",\"missionBrief\":\"游戏里的山脉、云朵、水面，往往不是美术画的，而是**算出来的**。\\n诀窍出乎意料地简单：**把好几个不同频率的波浪叠起来**。\\n\\n· 一个 `Math.sin(x * 0.018)` —— 只有连绵的大起伏，看着很假\\n· 再加一个 `Math.sin(x * 0.047)` —— 添上中等的丘陵\\n· 再加 `Math.sin(x * 0.113)` 和 `Math.sin(x * 0.27)` —— 补上细碎的碎石感\\n\\n四个波一叠加，就出现了「看着很自然、但说不出规律」的起伏。\\n这种东西有个专门的名字：**噪声**（更准确说是「分形噪声」）。\\n\\n规律是：**频率越高，振幅（波的高度）要越小。**\\n这里用的是 46 / 22 / 11 / 5 —— 每升一级频率，振幅就减半。\\n要是反过来（高频振幅大），地形就会变成一片扎人的尖刺。\\n\\n画法：在每个 x 上算出一个高度 h，然后从山顶画一条竖线到画面底部，\\n竖线挨着竖线排满，看上去就是实心的山体。\\n\\n最后按高度上色：低处草绿、山腰岩石灰、山顶积雪白。\",\"erLingHint\":\"提示：循环 x 从 -240 到 240 每次 +8；把四个不同频率的 Math.sin 加起来得到 h（振幅依次 46/22/11/5）；然后 drawLine(x, -50 + h, x, -180, 颜色, 8) 画竖线，颜色按 h 分三档。\",\"steps\":[{\"id\":1,\"title\":\"把几个不同频率的波叠加起来\"},{\"id\":2,\"title\":\"把高度画成一条条竖线，并按高度上色\"},{\"id\":3,\"title\":\"运行，看到自然的山脉\"}],\"codeMode\":true,\"defaultCode\":\"// 噪声地形：把不同频率的波叠起来，就得到自然的起伏\\nfor (let x = -240; x \u003c= 240; x = x + 8) {\\n  let h = 0;\\n  h = h + 46 * Math.sin(x * 0.018);            // 大起伏（频率低、振幅大）\\n  h = h + 22 * Math.sin(x * 0.047 + 1.3);      // 中丘陵\\n  h = h + 11 * Math.sin(x * 0.113 + 2.7);      // 小土包\\n  h = h + 5 * Math.sin(x * 0.27 + 0.6);        // 细碎石（频率高、振幅小）\\n\\n  const top = -50 + h;\\n  let c = \\\"#22C55E\\\";                            // 低处：草绿\\n  if (h \u003e 30) c = \\\"#E2E8F0\\\";                    // 高处：积雪白\\n  else if (h \u003e 0) c = \\\"#64748B\\\";                 // 山腰：岩石灰\\n  __runtime.drawLine(x, top, x, -180, c, 8);    // 从山顶画到底部，竖线挨着就是山体\\n}\\n\"}}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"12:I[27201,[\"/children-programming/_next/static/chunks/3esszyw7dl5_w.js\",\"/children-programming/_next/static/chunks/2228ow89um_7z.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\

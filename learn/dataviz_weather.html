, \"三\", \"四\", \"五\", \"六\", \"日\"];\nconst scale = 4.5;      // 1 度 = 4.5 个舞台单位高\nconst barW = 36, gap = 16, baseY = -110;\n\nlet sum = 0;                                    // 求总和 → 平均\nfor (let i = 0; i \u003c temps.length; i++) {\n  sum = sum + temps[i];\n}\nconst avg = sum / temps.length;\n\nlet hi = temps[0];                              // 求最高 / 最低（打擂台）\nlet lo = temps[0];\nfor (let i = 0; i \u003c temps.length; i++) {\n  if (temps[i] \u003e hi) hi = temps[i];\n  if (temps[i] \u003c lo) lo = temps[i];\n}\n\n__runtime.drawLine(-230, baseY, 230, baseY, \"#475569\", 3);            // 底线（从 0 度开始）\n__runtime.drawLine(-230, baseY + avg * scale, 230, baseY + avg * scale, \"rgba(226,232,240,0.45)\", 2);  // 平均线\n__runtime.drawText(120, baseY + avg * scale + 7, \"平均 \" + avg.toFixed(1) + \"°\", \"#94A3B8\", 13);\n__runtime.drawText(-225, 155, \"一周天气预报（°C）\", \"#E2E8F0\", 18);\n__runtime.drawText(60, 155, \"最高 \" + hi + \"°  最低 \" + lo + \"°\", \"#94A3B8\", 14);\n\nfor (let i = 0; i \u003c temps.length; i++) {\n  const h = temps[i] * scale;\n  const x = -180 + i * (barW + gap);\n  let c = \"#38bdf8\";                            // 凉爽 → 蓝\n  if (temps[i] \u003e= 26) c = \"#E24B4A\";            // 热 → 红\n  else if (temps[i] \u003e= 22) c = \"#F59E0B\";       // 温暖 → 橙\n  __runtime.drawRect(x, baseY, barW, h, c);\n  __runtime.drawText(x + 5, baseY + h + 6, temps[i] + \"°\", \"#E2E8F0\", 13);\n  __runtime.drawText(x + 11, baseY - 24, days[i], \"#94A3B8\", 14);\n}\n"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$L11\",null,{\"project\":{\"slug\":\"dataviz_weather\",\"title\":\"天气预报图：给图表加基准与颜色\",\"ageGroup\":\"13-16 岁\",\"description\":\"柱状图之上再加一层：算出平均值画成参考线，再让颜色随温度变化——一张图能同时说三件事。\",\"category\":\"dataviz\",\"missionBrief\":\"柱子画出来只是第一步。真正好用的图，还会告诉你「跟平均比怎么样」「哪天特别热」。\\n\\n这一关加三样东西：\\n\\n**1. 平均值**——先把所有温度加起来除以天数。这需要一个小循环：\\n· let sum = 0;\\n· for (...) { sum = sum + temps[i]; }\\n· const avg = sum / temps.length;\\n然后把它画成一条横贯全图的淡色**参考线**。\\n\\n**2. 最高与最低**——同样用循环，但每轮要

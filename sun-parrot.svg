<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="造物星球小太阳鹦鹉">
  <!-- 太阳光芒 -->
  <g fill="#FCD34D">
    <polygon points="32,3 29,12 35,12"/>
    <polygon points="32,3 29,12 35,12" transform="rotate(30 32 32)"/>
    <polygon points="32,3 29,12 35,12" transform="rotate(60 32 32)"/>
    <polygon points="32,3 29,12 35,12" transform="rotate(90 32 32)"/>
    <polygon points="32,3 29,12 35,12" transform="rotate(120 32 32)"/>
    <polygon points="32,3 29,12 35,12" transform="rotate(150 32 32)"/>
    <polygon points="32,3 29,12 35,12" transform="rotate(180 32 32)"/>
    <polygon points="32,3 29,12 35,12" transform="rotate(210 32 32)"/>
    <polygon points="32,3 29,12 35,12" transform="rotate(240 32 32)"/>
    <polygon points="32,3 29,12 35,12" transform="rotate(270 32 32)"/>
    <polygon points="32,3 29,12 35,12" transform="rotate(300 32 32)"/>
    <polygon points="32,3 29,12 35,12" transform="rotate(330 32 32)"/>
  </g>
  <!-- 太阳底盘 -->
  <circle cx="32" cy="32" r="23" fill="#FDE68A"/>
  <!-- 鹦鹉身体（太阳锥尾鹦鹉） -->
  <ellipse cx="32" cy="34" rx="16" ry="15" fill="#F59E0B"/>
  <!-- 头顶羽冠 -->
  <path d="M28 20 L26 12 L31 18 L32 10 L33 18 L38 12 L36 20 Z" fill="#FB923C"/>
  <!-- 绿色翅羽 -->
  <ellipse cx="45" cy="37" rx="5.5" ry="9" fill="#22C55E" transform="rotate(22 45 37)"/>
  <ellipse cx="19" cy="37" rx="5.5" ry="9" fill="#22C55E" transform="rotate(-22 19 37)"/>
  <!-- 浅金胸腹 -->
  <ellipse cx="32" cy="39" rx="10.5" ry="9" fill="#FBBF24"/>
  <!-- 橙色脸颊 -->
  <circle cx="24" cy="37" r="4.5" fill="#F97316"/>
  <circle cx="40" cy="37" r="4.5" fill="#F97316"/>
  <!-- 白色眼圈 -->
  <circle cx="26" cy="30" r="5" fill="#FFFFFF"/>
  <circle cx="38" cy="30" r="5" fill="#FFFFFF"/>
  <!-- 眼睛 -->
  <circle cx="26" cy="30" r="2.6" fill="#1F2937"/>
  <circle cx="38" cy="30" r="2.6" fill="#1F2937"/>
  <circle cx="27" cy="29" r="0.9" fill="#FFFFFF"/>
  <circle cx="39" cy="29" r="0.9" fill="#FFFFFF"/>
  <!-- 钩状喙 -->
  <path d="M26 35 Q32 32 38 35 Q37 41 32 43 Q27 41 26 35 Z" fill="#FCD34D" stroke="#D97706" stroke-width="1"/>
  <path d="M30 41 Q32 44 34 41 Q33 43 32 44 Q31 43 30 41 Z" fill="#B45309"/>
</svg>

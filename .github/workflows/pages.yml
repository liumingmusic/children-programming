name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 Actions 把构建产物发布到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build (static export → dist/)
        run: npm run build
        env:
          # 与本地一致：避免任何 ca/worker 相关注入干扰 next build 的 worker 进程
          NODE_OPTIONS: ""

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 注意：deploy-pages 的 timeout 输入单位为毫秒（代码里 MAX_TIMEOUT=600000）。
          # 此前误填 600（毫秒）导致秒级超时取消；这里用最大值 10 分钟，给 Pages 发布后端充足完成时间。
          timeout: 600000
